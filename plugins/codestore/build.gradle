apply plugin: 'java-library'

jar {
  archiveBaseName = calculateArtifactId(project)
  manifest {
    attributes(
      'Specification-Title': archiveBaseName,
      'Specification-Version': project.version,
      'Implementation-Title': archiveBaseName,
      'Implementation-Version': calculateVersion(),
      'Commit-Hash': getGitCommitDetails(40).hash
      )
  }
}

dependencies {
  api project(':plugin-api')
  api 'org.slf4j:slf4j-api'

  implementation project(':crypto:algorithms')
  implementation project(':ethereum:core')
  implementation project(':services:kvstore')
  implementation project(':util')

  implementation 'io.consensys.tuweni:tuweni-bytes'
  implementation 'org.apache.commons:commons-lang3'

  testImplementation project(':ethereum:core:plugin-api-worldstate-backend')
  testImplementation 'com.fasterxml.jackson.core:jackson-databind'
  testImplementation project(':config')
  testImplementation project(':crypto:algorithms')
  testImplementation project(':evm')
  testImplementation project(path: ':ethereum:core', configuration: 'testSupportArtifacts')
  jmhImplementation project(':ethereum:core')
  jmhImplementation project(':metrics:core')
  jmhImplementation project(':plugins:rocksdb')
  jmhImplementation 'org.mockito:mockito-core'

  testImplementation project(':datatypes')
  testImplementation project(':metrics:core')
  testImplementation project(':plugins:rocksdb')
  testImplementation 'org.mockito:mockito-core'

  testImplementation 'org.junit.jupiter:junit-jupiter'
  testImplementation 'org.assertj:assertj-core'
}

test {
  useJUnitPlatform {
    excludeTags 'slow'
  }
}

// The 1M-pair property test and the 50x SIGKILL test; about 5 GiB of temp files.
tasks.register('slowTest', Test) {
  description = 'Runs the long-running code store acceptance tests.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform {
    includeTags 'slow'
  }
  maxHeapSize = '2g'
  systemProperty 'codestore.property.pairs', System.getProperty('codestore.property.pairs', '1000000')
  systemProperty 'codestore.kill.iterations', System.getProperty('codestore.kill.iterations', '50')
  testLogging {
    showStandardStreams = true
    events 'passed', 'failed', 'skipped'
  }
}
