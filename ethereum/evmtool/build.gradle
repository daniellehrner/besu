plugins {
  id 'org.graalvm.buildtools.native' version '0.10.6'
}

apply plugin: 'java-library'
apply plugin: 'application'
apply plugin: 'idea'

jar {
  archiveBaseName = calculateArtifactId(project)
  manifest {
    attributes(
      'Specification-Title': archiveBaseName,
      'Specification-Version': project.version,
      'Implementation-Title': archiveBaseName,
      'Implementation-Version': calculateVersion(),
      'Commit-Hash': getGitCommitDetails(40).hash
      )
  }
}

dependencies {

  implementation project(':app')
  implementation project(':config')
  implementation project(':consensus:merge')
  implementation project(':crypto:algorithms')
  implementation project(':datatypes')
  implementation project(':ethereum:api')
  implementation project(':ethereum:blockcreation')
  implementation project(':ethereum:core')
  implementation project(':ethereum:eth')
  implementation project(':ethereum:referencetests')
  implementation project(':ethereum:rlp')
  implementation project(':evm')
  implementation project(':metrics:core')
  implementation project(':plugins:rocksdb')
  implementation project(':services:kvstore')
  implementation project(':util')

  implementation 'com.fasterxml.jackson.core:jackson-databind'
  implementation 'com.google.dagger:dagger'
  implementation 'com.google.guava:guava'
  implementation 'info.picocli:picocli'
  implementation 'io.vertx:vertx-core'
  implementation 'tools.profiler:async-profiler:4.0'
  implementation 'com.github.oshi:oshi-core:6.6.5'

  annotationProcessor 'com.google.dagger:dagger-compiler'
  annotationProcessor 'info.picocli:picocli-codegen'

  testImplementation 'org.assertj:assertj-core'
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testImplementation 'org.mockito:mockito-core'
  testImplementation 'org.mockito:mockito-junit-jupiter'

  // No logging in graalvm EvmTool
  nativeImageClasspath 'org.slf4j:slf4j-nop'
}

application {
  mainClass = 'org.hyperledger.besu.evmtool.EvmTool'
}

// Hive-equivalent fixture runners.
//
// `./hive --sim ethereum/eels/consume-engine` and `--sim ethereum/eels/consume-rlp` replay the
// execution-spec fixtures against a real Besu container: consume-engine over the Engine API
// (engine_newPayloadVX + engine_forkchoiceUpdatedVX), consume-rlp over the RLP block-import path.
// Both take hours. These tasks replay the same fixture trees through the same Besu code, in
// process, in minutes.
//
//   ./hive --sim ethereum/eels/consume-engine  ->  ./gradlew consumeEngineTests
//   ./hive --sim ethereum/eels/consume-rlp     ->  ./gradlew consumeRlpTests
//
// Both reuse the devnet fixture download/extract from the :ethereum:referencetests project
// (extractDevnetFixtures — no separate download) and fail the build on any fixture failure.
//
// Shared gradle properties, named after the hive flags they stand in for:
//   -PsimLimit=<regex>      hive --sim.limit, taken verbatim. Only tests whose pytest node id
//                           matches are run. See translateSimLimit below.
//   -PsimParallelism=N      hive --sim.parallelism. Left to the subcommand when unset, which
//                           defaults to the available processors.
//   -PsimPath=<subdir>      no hive equivalent: scope to one fixture subdirectory, e.g.
//                           for_amsterdam. Much cheaper than filtering the whole tree.
//
// Because the properties are shared, one command covers both simulators:
//   ./gradlew consumeEngineTests consumeRlpTests -PsimLimit='.*(7928|8282).*'

/**
 * Translates a hive --sim.limit regex into an evmtool --test-name expression.
 *
 * evmtool's filter escapes '.' to a literal before expanding '*' to '.*', because pytest node ids
 * contain ".py" and a bare '.' is far more often meant literally than as a wildcard. A hive regex
 * handed over untouched would therefore compile with its '.*' turned into '\..*' and match nothing.
 * Rewriting '.*' to '*' first restores the intent: evmtool expands it straight back to '.*'.
 *
 * hive matches partially when --sim.limit.exact=false, evmtool's glob form matches the whole node
 * id, and the leading/trailing '.*' hive patterns conventionally carry survive the rewrite as '*',
 * so the two agree. A pattern with no wildcard at all falls through to evmtool's substring form,
 * which is also a partial match.
 *
 * Not translated, and rare in --sim.limit values: a '?' quantifier (evmtool reads '?' as a
 * single-character wildcard) and a bare '.' meant as any-character (evmtool reads it literally).
 */
static String translateSimLimit(String simLimit) {
  return simLimit.replace('.*', '*')
}

def registerHiveEquivalentTask(project, String taskName, String subcommand, String fixtureDir, String desc, List<String> extraArgs) {
  return project.tasks.register(taskName, JavaExec) {
    description = desc
    group = 'verification'

    dependsOn ':ethereum:referencetests:extractDevnetFixtures'

    // The fixture path and filter are applied in doFirst, after Gradle has snapshotted the task
    // inputs, so every invocation looks identical to the up-to-date check and a task that once
    // succeeded would be skipped for every later -P combination — reporting BUILD SUCCESSFUL
    // without running a test. A verification task must always run.
    outputs.upToDateWhen { false }

    classpath = project.sourceSets.main.runtimeClasspath
    mainClass = 'org.hyperledger.besu.evmtool.EvmTool'

    def fixtures = project.project(':ethereum:referencetests').layout.buildDirectory
      .dir("execution-spec-devnet-tests/fixtures/${fixtureDir}")
    // Left unset when the property is absent, so the subcommand's own default applies rather than
    // this file keeping a second copy of it. All three runners default to the available cores.
    def parallelism = project.findProperty('simParallelism')?.toString()
    def subPath = project.findProperty('simPath')?.toString()
    def simLimit = project.findProperty('simLimit')?.toString()

    doFirst {
      def fixturesDir = fixtures.get().asFile
      if (!fixturesDir.exists()) {
        throw new GradleException(
        "Fixtures not found at ${fixturesDir}.\n" +
        "Run ./gradlew :ethereum:referencetests:extractDevnetFixtures, or check the " +
        "devnetTarConfig version in ethereum/referencetests/build.gradle.")
      }
      def runDir = subPath ? new File(fixturesDir, subPath) : fixturesDir
      if (!runDir.exists()) {
        throw new GradleException("Fixtures path not found: ${runDir} (from -PsimPath=${subPath})")
      }
      def cmd = [subcommand] + extraArgs
      if (parallelism != null) {
        cmd += ['--workers', parallelism]
      }
      if (simLimit != null) {
        cmd += ['--test-name', translateSimLimit(simLimit)]
      }
      cmd += runDir.absolutePath
      args = cmd
      logger.lifecycle("${taskName}: ${subcommand} over ${runDir}" +
        (simLimit != null ? " matching --sim.limit '${simLimit}'" : " (all tests)"))
    }
  }
}

// hive ethereum/eels/consume-engine
registerHiveEquivalentTask(project, 'consumeEngineTests', 'engine-test', 'blockchain_tests_engine',
  'Hive consume-engine equivalent: replays blockchain_tests_engine fixtures through the real Engine API.',
  [])

// hive ethereum/eels/consume-rlp. Not redundant with consume-engine: blockchain_tests_engine has no
// pre-merge fork groups, so for_frontier, for_homestead, for_tangerinewhistle, for_spuriousdragon,
// for_byzantium, for_constantinoplefix, for_istanbul, for_berlin and for_london exist only here.
registerHiveEquivalentTask(project, 'consumeRlpTests', 'block-test', 'blockchain_tests',
  'Hive consume-rlp equivalent: replays blockchain_tests fixtures through the RLP block-import path.',
  [])

// No hive simulator consumes state_tests — they are the EVM/state-transition-only slice, covered by
// neither consume-engine nor consume-rlp. Kept because that coverage is real, and it reuses the same
// -PsimParallelism / -PsimPath / -PsimLimit properties.
registerHiveEquivalentTask(project, 'stateTestsDevnet', 'state-test', 'state_tests',
  'Runs execution-spec devnet state_tests via the evmtool state-test runner.',
  ['--summary-only'])


// rename the top level dir from besu-<version> to besu and this makes it really
// simple for use in docker
tasks.register("dockerDistUntar") {
  dependsOn distTar
  dependsOn distZip
  def dockerBuildDir = "${buildDir}/docker-besu-evmtool"
  def distTarFile = distTar.outputs.files.singleFile
  def distTarFileName = distTar.outputs.files.singleFile.name.replace(".tar", "")

  doFirst {
    new File(dockerBuildDir).mkdir()
    copy {
      from tarTree(distTarFile)
      into(dockerBuildDir)
    }
    file("${dockerBuildDir}/${distTarFileName}").renameTo("${dockerBuildDir}/besu-evmtool")
  }
}

tasks.register('distDocker', Exec) {
  dependsOn dockerDistUntar
  def dockerBuildVersion = project.hasProperty('release.releaseVersion') ? project.property('release.releaseVersion') : "${rootProject.version}"
  def dockerOrgName = project.hasProperty('dockerOrgName') ? project.getProperty("dockerOrgName") : "hyperledger"
  def dockerArtifactName = project.hasProperty("dockerArtifactName") ? "${project.getProperty("dockerArtifactName")}-evmtool" : "besu-evmtool"
  def imageName = "${dockerOrgName}/${dockerArtifactName}"

  def image = "${imageName}:${dockerBuildVersion}"
  def dockerBuildDir = "${buildDir}/docker-besu-evmtool/"
  workingDir "${dockerBuildDir}"

  doFirst {
    copy {
      from file("${projectDir}/src/main/docker/Dockerfile")
      into(workingDir)
    }
  }

  def gitDetails = getGitCommitDetails(10)
  executable "sh"
  args "-c", "docker build --build-arg BUILD_DATE=${buildTime()} --build-arg VERSION=${dockerBuildVersion} --build-arg VCS_REF=${gitDetails.hash} -t ${image} ."
}

tasks.register('dockerUpload', Exec) {
  dependsOn distDocker
  String dockerBuildVersion = project.hasProperty('release.releaseVersion') ? project.property('release.releaseVersion') : "${rootProject.version}"
  def dockerOrgName = project.hasProperty('dockerOrgName') ? project.getProperty("dockerOrgName") : "hyperledger"
  def dockerArtifactName = project.hasProperty("dockerArtifactName") ? "${project.getProperty("dockerArtifactName")}-evmtool" : "besu-evmtool"
  def imageName = "${dockerOrgName}/${dockerArtifactName}"
  def image = "${imageName}:${dockerBuildVersion}"
  def cmd = "docker push '${image}'"
  def additionalTags = []

  if (project.hasProperty('branch') && project.property('branch') == 'main') {
    additionalTags.add('develop')
  }

  if (!(dockerBuildVersion ==~ /.*-SNAPSHOT/ || dockerBuildVersion ==~/.*develop.*/)) {
    additionalTags.add('latest')
    additionalTags.add(dockerBuildVersion.split(/\./)[0..1].join('.'))
  }

  additionalTags.each { tag -> cmd += " && docker tag '${image}' '${imageName}:${tag.trim()}' && docker push '${imageName}:${tag.trim()}'" }
  executable "sh"
  args "-c", cmd
}
